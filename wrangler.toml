# Cloudflare Pages Git 集成会读取本文件：
#   name                  → Pages 项目名（jjsou）
#   pages_build_output_dir → 构建输出目录（项目根，index.html 所在处）
#   functions/            → 自动识别为 Functions，无需配置
#
# 本项目不在 wrangler.toml 里放变量，全部在
# Cloudflare Dashboard → 项目 → Settings → Variables and Secrets 中维护
name = "jjsou"
compatibility_date = "2025-07-12"
pages_build_output_dir = "."
