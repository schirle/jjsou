# Cloudflare Pages 项目结构约定（重要）：
#   public/     → 构建输出目录（静态资产：index.html）
#   functions/  → Pages Functions，必须位于构建输出目录之外（仓库根）
#
# 因此在 Dashboard → Settings → Build 里「构建输出目录」要填：public
# （若填 / 或留空，functions/ 会落入输出目录内部，被当成静态文件，接口全部 404）
#
# 变量不放这里，统一在 Dashboard → Settings → Variables and Secrets 维护
name = "jjsou"
compatibility_date = "2025-07-12"
pages_build_output_dir = "public"
